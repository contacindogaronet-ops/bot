name: Build Telegram Userbot

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Build Static Binary ARM64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          go mod tidy
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/tg-userbot-arm64 .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tg-userbot-arm64
          path: dist/tg-userbot-arm64
