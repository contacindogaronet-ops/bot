name: Build Telegram Userbot

on:
  push:
    paths:
      - 'userbot/**'
      - '.github/workflows/build-userbot.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Tidy Dependencies
        working-directory: ./userbot
        run: go mod tidy

      - name: Build Static ARM64 Binary
        working-directory: ./userbot
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags="-s -w" -o dist/tg-userbot-arm64 .

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: tg-userbot-arm64
          path: userbot/dist/tg-userbot-arm64
